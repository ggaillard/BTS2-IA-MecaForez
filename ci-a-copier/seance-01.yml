name: "Séance 1 – Scénarios de prêt"

on:
  push:
    paths: ["seance-01-specifier/depart/**", ".github/workflows/seance-01.yml"]
  pull_request:
    paths: ["seance-01-specifier/depart/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scenarios:
    name: "🥒 Scénarios Gherkin (Reqnroll)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: seance-01-specifier/depart

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "⚙️ Setup .NET 10"
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: "📋 Au moins six scénarios dans Prets.feature"
        run: |
          n=$(grep -cE '^\s*(Scénario|Plan du scénario)\s*:' tests/PretsMateriel.Specs/Features/Prets.feature || true)
          echo "Scénarios trouvés : $n"
          if [ "$n" -lt 6 ]; then
            echo "::error::Prets.feature contient $n scénario(s) : il en faut au moins 6."
            exit 1
          fi

      - name: "🔒 Le contrat n'a pas été touché par la branche de l'agent"
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'agent/')
        run: |
          git fetch origin "${{ github.base_ref }}"
          changes=$(git log --format='%h %s' "origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}" -- '*.feature' | grep -v ' spec:' || true)
          if [ -n "$changes" ]; then
            echo "::error::Des fichiers .feature ont été modifiés hors d'un commit « spec: » :"
            echo "$changes"
            exit 1
          fi

      - name: "🧪 Rejouer les scénarios"
        run: dotnet test --logger "console;verbosity=normal"
